name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # Tag must match packages/toolkit/package.json version.
      - name: Check tag matches package version
        run: |
          PKG=$(node -p "require('./packages/toolkit/package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          [ "$PKG" = "$TAG" ] || { echo "Tag $TAG != package.json $PKG"; exit 1; }

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - run: npm install -g npm@latest

      # A version with a hyphen is a prerelease -> publish under its prerelease
      # identifier as dist-tag (0.5.0-rc.1 -> "rc", 0.1.0-beta.2 -> "beta") so
      # plain `pnpm add @preprio/toolkit` never picks it up.
      - name: Publish
        working-directory: packages/toolkit
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) TAG=$(echo "${GITHUB_REF_NAME#*-}" | sed 's/[.0-9].*//') ;;
            *)   TAG=latest ;;
          esac
          [ -n "$TAG" ] || { echo "Prerelease needs a named identifier (rc.1, beta.1)"; exit 1; }
          echo "Publishing to dist-tag: $TAG"
          npm publish --provenance --access public --tag "$TAG"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
