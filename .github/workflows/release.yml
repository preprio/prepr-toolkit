name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # Tag must match packages/toolkit/package.json version.
      - name: Check tag matches package version
        run: |
          PKG=$(node -p "require('./packages/toolkit/package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          [ "$PKG" = "$TAG" ] || { echo "Tag $TAG != package.json $PKG"; exit 1; }

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # A version with a hyphen (0.1.0-beta.1) is a prerelease -> publish under
      # the "beta" dist-tag so plain `pnpm add @preprio/toolkit` never picks it up.
      - name: Publish
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) TAG=beta ;;
            *)   TAG=latest ;;
          esac
          echo "Publishing to dist-tag: $TAG"
          pnpm publish --filter @preprio/toolkit --no-git-checks \
            --provenance --access public --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
